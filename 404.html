<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Página não encontrada — CVAT Brasil</title>
  <meta name="description" content="A página que você procura não existe ou foi movida. Volte para a página inicial da CVAT Brasil." />
  <meta name="robots" content="noindex, follow" />

  <!-- GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HSEYX6K0FM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HSEYX6K0FM');
    gtag('event', 'page_not_found', { page_path: window.location.pathname });
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />

  <style>
    .notfound-section {
      min-height: calc(100dvh - 200px);
      display: flex;
      align-items: center;
      padding: 5rem 1.25rem;
    }
    .notfound-inner {
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }
    .notfound-code {
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: clamp(5rem, 18vw, 9rem);
      font-weight: 700;
      line-height: 1;
      color: var(--color-blue, #011633);
      opacity: .08;
      user-select: none;
      margin-bottom: -1rem;
    }
    .notfound-icon {
      margin: 0 auto 1.5rem;
      width: 64px;
      height: 64px;
      background: var(--color-blue-light, #e8edf5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notfound-title {
      font-family: 'Sora', 'Inter', sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.25rem);
      font-weight: 700;
      color: var(--color-blue, #011633);
      margin-bottom: .75rem;
    }
    .notfound-desc {
      font-size: 1rem;
      color: var(--color-gray-500, #64748b);
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .notfound-actions {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    .notfound-search {
      border-top: 1px solid var(--color-gray-100, #f1f5f9);
      padding-top: 2rem;
      margin-top: .5rem;
    }
    .notfound-search-label {
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--color-gray-500, #64748b);
      margin-bottom: .875rem;
    }
    .notfound-search-wrap {
      display: flex;
      gap: .5rem;
      max-width: 440px;
      margin: 0 auto;
    }
    .notfound-search-input {
      flex: 1;
      padding: .75rem 1rem;
      border: 1.5px solid var(--color-gray-200, #e2e8f0);
      border-radius: 10px;
      font-size: .95rem;
      font-family: inherit;
      color: var(--color-blue, #011633);
      background: #fff;
      outline: none;
      transition: border-color .18s;
    }
    .notfound-search-input:focus {
      border-color: var(--color-blue, #011633);
    }
    .notfound-search-btn {
      padding: .75rem 1.25rem;
      background: var(--color-blue, #011633);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: .5rem;
      transition: background .18s;
      text-decoration: none;
      white-space: nowrap;
    }
    .notfound-search-btn:hover {
      background: #023369;
    }
  </style>
</head>
<body>

  <a href="#main-content" class="skip-link">Ir para o conteúdo principal</a>
  <div id="header-placeholder"></div>

  <main id="main-content">
    <section class="notfound-section">
      <div class="notfound-inner">

        <div class="notfound-code" aria-hidden="true">404</div>

        <div class="notfound-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-blue, #011633)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35M11 8v3M11 14h.01"/></svg>
        </div>

        <h1 class="notfound-title">Página não encontrada</h1>
        <p class="notfound-desc">
          O endereço que você acessou não existe ou foi movido.<br>
          Verifique se a URL está correta ou navegue pelo site abaixo.
        </p>

        <div class="notfound-actions">
          <a href="/" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Página inicial
          </a>
          <a href="/pages/treinamentos" class="btn btn-outline">
            Ver treinamentos
          </a>
          <a href="/pages/blog/" class="btn btn-outline">
            Ir para o blog
          </a>
        </div>

        <div class="notfound-search">
          <p class="notfound-search-label">Buscar no blog</p>
          <div class="notfound-search-wrap">
            <label for="notfound-search-input" class="sr-only">Buscar artigo</label>
            <input
              type="search"
              id="notfound-search-input"
              class="notfound-search-input"
              placeholder="NR-01, riscos psicossociais, HSE-IT…"
              autocomplete="off"
            />
            <a id="notfound-search-btn" href="/pages/blog/" class="notfound-search-btn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              Buscar
            </a>
          </div>
        </div>

      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>
  <script src="/assets/js/main.js" defer></script>

  <script>
    (function () {
      var input  = document.getElementById('notfound-search-input');
      var btn    = document.getElementById('notfound-search-btn');
      function goSearch() {
        var q = input ? input.value.trim() : '';
        if (q) btn.href = '/pages/blog/?q=' + encodeURIComponent(q);
        else   btn.href = '/pages/blog/';
      }
      input?.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { goSearch(); btn.click(); }
      });
      input?.addEventListener('input', goSearch);
    })();
  </script>

</body>
</html>
